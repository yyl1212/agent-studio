services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: agent_studio
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - agent_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_studio"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  agent_pg_data:
