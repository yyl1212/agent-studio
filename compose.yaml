services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: agent_studio
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - agent_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_studio"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: agent-studio:dev
    build:
      context: .
    entrypoint: ["/app/agent-studio-api"]
    environment: &runtime-environment
      DATABASE_URL: postgres://agent:agent@db:5432/agent_studio?sslmode=disable
      RUN_PAYLOAD_ENCRYPTION_KEY: ${RUN_PAYLOAD_ENCRYPTION_KEY:?must be set}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-}
      HTTP_NODE_ALLOW_PRIVATE: ${HTTP_NODE_ALLOW_PRIVATE:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    image: agent-studio:dev
    build:
      context: .
    entrypoint: ["/app/agent-studio-worker"]
    environment:
      <<: *runtime-environment
      WORKER_MAX_ACTIVE_RUNS: "1"
      OTEL_SERVICE_NAME: agent-studio-worker
    depends_on:
      db:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    profiles: [observability]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD", "/cmd/jaeger/jaeger", "version"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  agent_pg_data:
