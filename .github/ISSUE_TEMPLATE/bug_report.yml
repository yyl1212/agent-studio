name: Bug 报告
description: 报告可稳定复现的 Agent Studio 缺陷
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请使用私密报告入口，不要在这里粘贴密钥。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同问题
          required: true
        - label: 此报告不包含密钥、个人数据或未披露漏洞
          required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 请填写 agent-studio version 输出或 Git commit
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - macOS
        - Linux
        - Windows + Docker Desktop
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、确定的操作序列
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 仅粘贴复现所需片段，并先删除 URL、Token 和个人数据
