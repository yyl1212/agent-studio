name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    outputs:
      artifact_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify main head
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
      - name: Verify annotated release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          sh scripts/check-version.sh "$GITHUB_REF_NAME"
      - name: Select tag artifact version
        id: tag-version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Select dry-run artifact version
        id: dry-version
        if: github.event_name == 'workflow_dispatch'
        run: echo "value=v0.3.1-snapshot" >> "$GITHUB_OUTPUT"
      - name: Export artifact version
        id: version
        env:
          TAG_VERSION: ${{ steps.tag-version.outputs.value }}
          DRY_VERSION: ${{ steps.dry-version.outputs.value }}
        run: echo "value=${TAG_VERSION:-$DRY_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm@10.34.5 install --frozen-lockfile
      - name: Verify source
        run: make verify-quick
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0
      - name: Add Syft to PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT_CMD" >> "$GITHUB_PATH"
      - name: Build tagged artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish
      - name: Build dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --snapshot --skip=publish
      - name: Verify artifact collection
        env:
          ARTIFACT_VERSION: ${{ steps.version.outputs.value }}
        run: sh scripts/check-release-artifacts.sh collection dist "$ARTIFACT_VERSION"
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/checksums.txt

  smoke:
    name: Smoke ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download release candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify native artifact
        env:
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          release_commit=$(git rev-parse HEAD)
          sh scripts/check-release-artifacts.sh target dist "$ARTIFACT_VERSION" \
            "$TARGET_GOOS" "$TARGET_GOARCH" "$release_commit"

  publish:
    name: Publish verified release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Reverify artifact collection
        env:
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
        run: sh scripts/check-release-artifacts.sh collection dist "$ARTIFACT_VERSION"
      - name: Assert release does not exist
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf 'release already exists: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Create draft and upload tested assets
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$(git rev-parse HEAD)" \
            --draft \
            --title "Agent Studio $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.spdx.json dist/checksums.txt
      - name: Verify draft asset set
        run: |
          {
            for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
              printf 'agent-studio_%s_%s.tar.gz\n' "$GITHUB_REF_NAME" "$target"
              printf 'agent-studio_%s_%s.tar.gz.spdx.json\n' "$GITHUB_REF_NAME" "$target"
            done
            printf 'checksums.txt\n'
          } | sort > expected-assets.txt
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          test "$(wc -l < actual-assets.txt | tr -d ' ')" -eq 9
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].size > 0] | all')" = true
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$GITHUB_REF_NAME" --json tagName --jq '.tagName')" = "$GITHUB_REF_NAME"

          remote_dist=$(mktemp -d)
          trap 'rm -rf "$remote_dist"' EXIT HUP INT TERM
          gh release download "$GITHUB_REF_NAME" --dir "$remote_dist"
          sh scripts/check-release-artifacts.sh collection "$remote_dist" "$GITHUB_REF_NAME"
          for local_file in dist/*; do
            remote_file="$remote_dist/$(basename "$local_file")"
            test -f "$remote_file"
            cmp -- "$local_file" "$remote_file"
          done

          tag_api="repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME"
          test "$(gh api "$tag_api" --jq '.object.type')" = tag
          tag_object=$(gh api "$tag_api" --jq '.object.sha')
          annotated_api="repos/$GITHUB_REPOSITORY/git/tags/$tag_object"
          test "$(gh api "$annotated_api" --jq '.object.type')" = commit
          test "$(gh api "$annotated_api" --jq '.object.sha')" = "$(git rev-parse HEAD)"
      - name: Promote verified release
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc.*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest ;;
          esac
      - name: Verify published release state
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc.*)
              test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | join(",")')" = "false,true"
              ;;
            *)
              test "$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | join(",")')" = "false,false"
              ;;
          esac
      - name: Verify immutable release
        run: bash scripts/check-release-immutability.sh verify "$GITHUB_REF_NAME"
