name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability-config:
    name: Observability configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_PAYLOAD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate observability Compose
        run: sh scripts/check-observability-compose.sh

  go:
    name: Go quick verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go
        run: make verify-go-quick

  web:
    name: Web quick verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm@10.34.5 install --frozen-lockfile
      - name: Verify Web
        run: make verify-web-quick

  backup-recovery:
    name: Backup recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      EXTERNAL_DB: "1"
      TEST_DATABASE_URL: postgres://agent:agent@localhost:5432/agent_studio?sslmode=disable
      RUN_PAYLOAD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: agent_studio
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify backup recovery
        run: make test-backup-e2e

  durable-runs:
    name: Durable run recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
      RUN_PAYLOAD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DURABLE_E2E_ARTIFACT_DIR: artifacts/durable-runs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify E2E contract
        run: sh scripts/test-durable-runs-e2e_test.sh
      - name: Exercise crash recovery
        run: make test-durable-runs-e2e
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-runs-logs
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/durable-runs/

  rc-capacity:
    name: RC capacity baseline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CGO_ENABLED: "0"
      RUN_PAYLOAD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      RC_CAPACITY_ARTIFACT_DIR: artifacts/rc-capacity
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify capacity contract
        run: sh scripts/test-rc-capacity-e2e_test.sh
      - name: Exercise 500-run capacity baseline
        timeout-minutes: 10
        run: timeout 10m make test-rc-capacity-e2e
      - name: Preserve capacity summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-capacity-summary
          if-no-files-found: error
          retention-days: 7
          path: artifacts/rc-capacity/summary.json
      - name: Preserve capacity failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-capacity-logs
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/rc-capacity/*.log

  v04-upgrade-rollback:
    name: v0.4 upgrade rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "0"
      RUN_PAYLOAD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      V04_UPGRADE_ROLLBACK_ARTIFACT_DIR: artifacts/v04-upgrade-rollback
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify upgrade contract
        run: sh scripts/test-v05-upgrade-rollback-e2e_test.sh
      - name: Exercise v0.4 upgrade and rollback
        timeout-minutes: 10
        run: timeout 10m make test-v05-upgrade-rollback-e2e
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v04-upgrade-rollback-logs
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/v04-upgrade-rollback/*.log

  release-artifacts:
    name: Release artifact snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0
      - name: Add Syft to PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT_CMD" >> "$GITHUB_PATH"
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - name: Lint workflows
        run: make verify-workflows
      - name: Check release configuration
        run: make release-check GORELEASER=goreleaser SYFT=syft
      - name: Build and verify release snapshot
        run: make release-snapshot GORELEASER=goreleaser SYFT=syft
