          type: array
          items:
            $ref: "#/components/schemas/FrozenEdgePreview"
        effectiveSafety:
          $ref: "#/components/schemas/ExecutionSafety"
        requiresConfirmation:
          type: boolean
    RerunRequest:
      type: object
      additionalProperties: false
      required: [entryInput, confirmSideEffects]
      properties:
        entryInput:
          type: object
          additionalProperties: true
        confirmSideEffects:
          type: boolean
    PublicError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        kind:
          type: string
          enum: [config, input, temporary, canceled, internal]
        message:
          type: string
        nodeId:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
    CreateWorkflowRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    UpdateWorkflowRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
    CopyWorkflowRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    SaveDraftRequest:
      type: object
      additionalProperties: false
      required: [draftRevision, graph]
      properties:
        draftRevision:
          type: integer
          format: int64
        graph:
          $ref: "#/components/schemas/Graph"
    DraftRunRequest:
      type: object
      additionalProperties: false
      required: [draftRevision, input]
      properties:
        draftRevision:
          type: integer
          format: int64
        input:
          type: object
          additionalProperties: true
    AgentRunRequest:
      type: object
      additionalProperties: false
      required: [workflowVersionId, input]
      properties:
        workflowVersionId:
          type: string
          format: uuid
        input:
          type: object
          additionalProperties: true
