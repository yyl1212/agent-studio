openapi: 3.1.0
info:
  title: Agent Studio API
  version: 0.1.0
  description: 轻量化 Agent Studio 的本地 API。
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          $ref: "#/components/responses/Error"
  /api/node-types:
    get:
      operationId: listNodeTypes
      responses:
        "200":
          description: 节点定义
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeDefinition"
  /api/node-types/{type}/{version}/resolve:
    post:
      operationId: resolveNodeType
      parameters:
        - $ref: "#/components/parameters/NodeType"
        - $ref: "#/components/parameters/NodeVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [config]
              properties:
                config:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: 解析后的端口
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedPorts"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/node-index/status:
    get:
      operationId: getNodeIndexStatus
      responses:
        "200":
          description: 当前本地节点索引状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeIndexStatus"
        "500":
          $ref: "#/components/responses/Error"
  /api/node-packages:
    get:
      operationId: listNodePackages
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 128
        - name: category
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items:
              type: string
              minLength: 1
              maxLength: 32
              pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        - name: compatible
          in: query
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        "200":
          description: 节点包搜索结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePackageSearchResult"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/node-package:
    get:
      operationId: getNodePackage
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: 节点包详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePackageDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/workflows:
    get:
      operationId: listWorkflows
      responses:
        "200":
          description: 工作流列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
    post:
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRequest"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/workflow-summaries:
    get:
      operationId: listWorkflowSummaries
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
            description: UTF-8 编码最多 100 字节。
            x-agent-studio-max-bytes: 100
        - name: state
          in: query
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 工作流管理摘要页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSummaryPage"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: getWorkflow
      responses:
        "200":
          description: 工作流草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowRequest"
      responses:
        "200":
          description: 已更新工作流元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    put:
      operationId: saveWorkflowDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDraftRequest"
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}/copies:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: copyWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyWorkflowRequest"
      responses:
        "201":
          description: 已创建工作流副本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: archiveWorkflow
      responses:
        "200":
          description: 已归档工作流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: restoreWorkflow
      responses:
        "200":
          description: 已恢复工作流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}/template:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: exportWorkflowTemplate
      parameters:
        - name: draftRevision
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: 规范化工作流模板下载
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}/validate:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: validateWorkflow
      responses:
        "200":
          description: 校验结果
          content:
            application/json:
              schema:
                type: object
                required: [valid, issues]
                properties:
                  valid:
                    type: boolean
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/ValidationIssue"
        "409":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}/test-runs:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: runWorkflowDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRunRequest"
      responses:
        "200":
          description: 每行一个 RunEvent 的 NDJSON 流
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 每行符合 RunEvent Schema。
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    post:
      operationId: publishWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draftRevision]
              properties:
                draftRevision:
                  type: integer
                  format: int64
      responses:
        "201":
          description: 不可变工作流版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/workflows/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: listWorkflowRuns
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: 运行记录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
  /api/workflow-templates/preview:
    post:
      operationId: previewWorkflowTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewWorkflowTemplateRequest"
      responses:
        "200":
          description: 模板兼容性预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplatePreview"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/workflow-templates/import:
    post:
      operationId: importWorkflowTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportWorkflowTemplateRequest"
      responses:
        "201":
          description: 已创建未发布工作流草稿
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/agents/{slug}:
    parameters:
      - $ref: "#/components/parameters/AgentSlug"
    get:
      operationId: getAgentManifest
      responses:
        "200":
          description: 当前发布页 Manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentManifest"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/agents/{slug}/runs:
    parameters:
      - $ref: "#/components/parameters/AgentSlug"
    post:
      operationId: runAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunRequest"
      responses:
        "200":
          description: 每行一个 RunEvent 的 NDJSON 流
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 每行符合 RunEvent Schema。
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/runs:
    get:
      operationId: listRunSummaries
      parameters:
        - name: workflowId
          in: query
          schema:
            type: string
            format: uuid
        - name: runId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            items:
              type: string
              enum: [running, cancelling, completed, failed, cancelled]
        - name: mode
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              type: string
              enum: [test, published, debug]
        - name: startedAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: startedBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: 全局运行摘要页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummaryPage"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/runs/{id}:
    get:
      operationId: getRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 运行详情
          content:
            application/json:
              schema:
                type: object
                required: [run, nodeRuns]
                properties:
                  run:
                    $ref: "#/components/schemas/Run"
                  nodeRuns:
                    type: array
                    items:
                      $ref: "#/components/schemas/NodeRun"
        "404":
          $ref: "#/components/responses/Error"
  /api/runs/{id}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 已请求取消的运行摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /api/runs/{id}/debug:
    get:
      operationId: getRunDebug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 运行回放概览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebugOverview"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/runs/{id}/events:
    get:
      operationId: listRunEvents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: afterSequence
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: 运行事件页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventPage"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/runs/{id}/nodes/{nodeId}/rerun-preview:
    get:
      operationId: previewNodeRerun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 局部重跑预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RerunPreview"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/runs/{id}/nodes/{nodeId}/reruns:
    post:
      operationId: rerunFromNode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunRequest"
      responses:
        "200":
          description: 每行一个新 Debug RunEvent 的 NDJSON 流
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 每行符合 RunEvent Schema。
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
components:
  parameters:
    WorkflowID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    NodeType:
      name: type
      in: path
      required: true
      schema:
        type: string
    NodeVersion:
      name: version
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: 稳定错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Position:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
    Node:
      type: object
      additionalProperties: false
      required: [id, type, typeVersion, position, config]
      properties:
        id:
          type: string
        type:
          type: string
        typeVersion:
          type: string
        position:
          $ref: "#/components/schemas/Position"
        config:
          type: object
          additionalProperties: true
    Edge:
      type: object
      additionalProperties: false
      required: [id, source, sourcePort, target, targetPort]
      properties:
        id:
          type: string
        source:
          type: string
        sourcePort:
          type: string
        target:
          type: string
        targetPort:
          type: string
    Graph:
      type: object
      additionalProperties: false
      required: [schemaVersion, nodes, edges]
      properties:
        schemaVersion:
          type: integer
          const: 1
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/Node"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
    PortDefinition:
      type: object
      required: [key, title, type, required, cardinality]
      properties:
        key:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [string, number, boolean, json, any]
        required:
          type: boolean
        cardinality:
          type: string
          enum: [one, single-active]
    ResolvedPorts:
      type: object
      required: [inputs, outputs]
      properties:
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDefinition"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDefinition"
    NodeDefinition:
      type: object
      required: [type, version, title, description, category, configSchema, inputs, outputs, capabilities, executionSafety, package]
      properties:
        type:
          type: string
        version:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        configSchema:
          type: object
          additionalProperties: true
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDefinition"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/PortDefinition"
        capabilities:
          type: array
          items:
            type: string
            enum: [network, secrets, filesystem-read, filesystem-write]
        executionSafety:
          type: string
          enum: [pure, read_only, side_effect]
        package:
          $ref: "#/components/schemas/NodePackageSummary"
    NodePackageSource:
      type: string
      enum: [builtin, module, development, replacement]
    NodePackageSummary:
      type: object
      additionalProperties: false
      required: [name, displayName, license, repository, source]
      properties:
        name:
          type: string
        displayName:
          type: string
        version:
          type: string
        license:
          type: string
        repository:
          type: string
          format: uri
        source:
          $ref: "#/components/schemas/NodePackageSource"
    NodeIndexStatus:
      type: object
      additionalProperties: false
      required: [source, release, generatedAt, packageCount, compatiblePackageCount, runtimeVersion, nodeAPI, stale, warningCode]
      properties:
        source:
          type: string
          enum: [embedded, cache]
        release:
          $ref: "#/components/schemas/NodeIndexStableSemver"
        generatedAt:
          type: string
          format: date-time
          pattern: "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$"
        packageCount:
          type: integer
          minimum: 0
          maximum: 1000
        compatiblePackageCount:
          type: integer
          minimum: 0
          maximum: 1000
        runtimeVersion:
          type: string
          minLength: 1
          maxLength: 128
        nodeAPI:
          type: string
          minLength: 1
          maxLength: 128
        stale:
          type: boolean
        warningCode:
          oneOf:
            - type: string
              enum: [INDEX_EMBEDDED_SNAPSHOT, INDEX_CONTENT_INVALID]
            - type: "null"
    NodePackageSearchResult:
      type: object
      additionalProperties: false
      required: [release, total, offset, limit, items]
      properties:
        release:
          $ref: "#/components/schemas/NodeIndexStableSemver"
        total:
          type: integer
          minimum: 0
          maximum: 1000
        offset:
          type: integer
          minimum: 0
          maximum: 10000
        limit:
          type: integer
          minimum: 1
          maximum: 100
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/IndexedNodePackageSummary"
    IndexedNodePackageSummary:
      type: object
      additionalProperties: false
      required: [name, displayName, description, license, repository, categories, keywords, recommendedVersion, reasons]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 512
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        license:
          type: string
          minLength: 1
          maxLength: 128
        repository:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: "^https://[^/?#@]+(?:/[^?#]*)?$"
        categories:
          $ref: "#/components/schemas/NodePackageCategories"
        keywords:
          $ref: "#/components/schemas/NodePackageKeywords"
        recommendedVersion:
          oneOf:
            - $ref: "#/components/schemas/NodePackageVersionSummary"
            - type: "null"
        reasons:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/NodePackageCompatibilityReason"
    NodePackageDetail:
      type: object
      additionalProperties: false
      required: [name, categories, keywords, versions, recommendedVersion, reasons, assessments]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 512
        categories:
          $ref: "#/components/schemas/NodePackageCategories"
        keywords:
          $ref: "#/components/schemas/NodePackageKeywords"
        versions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/IndexedNodePackageVersion"
        recommendedVersion:
          oneOf:
            - $ref: "#/components/schemas/NodePackageVersionSummary"
            - type: "null"
        reasons:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/NodePackageCompatibilityReason"
        assessments:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/NodePackageVersionAssessment"
    NodePackageVersionSummary:
      type: object
      additionalProperties: false
      required: [version, source, lifecycle, compatibility]
      properties:
        version:
          $ref: "#/components/schemas/NodeIndexGoSemver"
        source:
          $ref: "#/components/schemas/NodePackageIndexSource"
        lifecycle:
          $ref: "#/components/schemas/NodePackageLifecycle"
        compatibility:
          $ref: "#/components/schemas/NodePackageCompatibility"
    NodePackageVersionAssessment:
      type: object
      additionalProperties: false
      required: [version, compatible, reasons]
      properties:
        version:
          $ref: "#/components/schemas/NodeIndexGoSemver"
        compatible:
          type: boolean
        reasons:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/NodePackageCompatibilityReason"
    IndexedNodePackageVersion:
      type: object
      additionalProperties: false
      required: [version, source, review, lifecycle, manifest]
      properties:
        version:
          $ref: "#/components/schemas/NodeIndexGoSemver"
        source:
          $ref: "#/components/schemas/NodePackageIndexSource"
        review:
          $ref: "#/components/schemas/NodePackageReview"
        lifecycle:
          $ref: "#/components/schemas/NodePackageLifecycle"
        manifest:
          $ref: "#/components/schemas/IndexedNodePackageManifest"
    NodePackageIndexSource:
      type: object
      additionalProperties: false
      required: [repository, moduleDir, tag, commit, manifestDigest]
      properties:
        repository:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: "^https://github\\.com/[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/[A-Za-z0-9._-]+$"
        moduleDir:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: "^(?:\\.|(?:[^./\\\\](?:[^/\\\\])?|\\.[^./\\\\]|[^/\\\\]{3,})(?:/(?:[^./\\\\](?:[^/\\\\])?|\\.[^./\\\\]|[^/\\\\]{3,}))*)$"
        tag:
          type: string
          minLength: 1
          maxLength: 512
        commit:
          $ref: "#/components/schemas/NodeIndexGitOID"
        manifestDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    NodePackageReview:
      type: object
      additionalProperties: false
      required: [status, reviewedAt, indexCommit]
      properties:
        status:
          type: string
          const: approved
        reviewedAt:
          type: string
          format: date-time
          pattern: "^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$"
        indexCommit:
          $ref: "#/components/schemas/NodeIndexGitOID"
    NodePackageLifecycle:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status:
          type: string
          enum: [active, deprecated, withdrawn]
        message:
          type: string
          maxLength: 2048
      oneOf:
        - properties:
            status:
              const: active
            message:
              const: ""
        - properties:
            status:
              enum: [deprecated, withdrawn]
            message:
              type: string
              minLength: 1
              maxLength: 2048
              pattern: "^[^<>]+$"
    IndexedNodePackageManifest:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, metadata, compatibility, registrations]
      properties:
        apiVersion:
          type: string
          const: agent-studio.dev/v1alpha1
        kind:
          type: string
          const: NodePackage
        metadata:
          $ref: "#/components/schemas/IndexedNodePackageMetadata"
        compatibility:
          $ref: "#/components/schemas/NodePackageCompatibility"
        registrations:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/NodePackageRegistration"
    IndexedNodePackageMetadata:
      type: object
      additionalProperties: false
      required: [name, displayName, description, license, repository]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 512
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        license:
          type: string
          minLength: 1
          maxLength: 128
        repository:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: "^https://[^/?#@]+(?:/[^?#]*)?$"
    NodePackageCompatibility:
      type: object
      additionalProperties: false
      required: [nodeAPI, runtime]
      properties:
        nodeAPI:
          type: string
          minLength: 1
          maxLength: 128
        runtime:
          $ref: "#/components/schemas/NodePackageRuntimeRange"
    NodePackageRuntimeRange:
      type: object
      additionalProperties: false
      required: [minVersion, maxVersionExclusive]
      properties:
        minVersion:
          $ref: "#/components/schemas/NodeIndexSemver"
        maxVersionExclusive:
          $ref: "#/components/schemas/NodeIndexSemver"
    NodePackageRegistration:
      type: object
      additionalProperties: false
      required: [package, nodes]
      properties:
        package:
          type: string
          minLength: 1
          maxLength: 512
        nodes:
          type: array
          minItems: 1
          maxItems: 512
          uniqueItems: true
          items:
            $ref: "#/components/schemas/NodePackageRegistrationNode"
    NodePackageRegistrationNode:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 256
        version:
          type: string
          minLength: 1
          maxLength: 128
    NodePackageCategories:
      type: array
      maxItems: 8
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 32
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    NodePackageKeywords:
      type: array
      maxItems: 16
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 64
    NodePackageCompatibilityReason:
      type: string
      enum: [runtime_invalid, node_api_mismatch, runtime_too_old, runtime_too_new, no_active_stable_version]
    NodeIndexGitOID:
      type: string
      pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
    NodeIndexSemver:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$"
    NodeIndexGoSemver:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^v(0|[1-9][0-9]*)(?:\\.(0|[1-9][0-9]*)(?:\\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?)?)?$"
    NodeIndexStableSemver:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
    ValidationIssue:
